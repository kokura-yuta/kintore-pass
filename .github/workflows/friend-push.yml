name: Friend training notifications

on:
  workflow_dispatch:
  schedule:
    # Five-minute best effort; offset from the busy start of the hour.
    - cron: '2-57/5 * * * *'

permissions: {}

concurrency:
  group: friend-push-production
  cancel-in-progress: false

jobs:
  drain:
    if: github.repository == 'kokura-yuta/kintore-pass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      id-token: write
    steps:
      # No checkout, third-party actions, npm packages, or long-lived credentials.
      - name: Drain authorized notification queue and check delivery receipts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://musclepas-api.y0u2t1a8.chatgpt.site/api/internal/friend-push/drain';
          const identityUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          identityUrl.searchParams.set('audience', endpoint);
          const identity = await fetch(identityUrl, {
            headers: {Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          if (!identity.ok) throw new Error(`GitHub identity unavailable (${identity.status})`);
          const {value} = await identity.json();
          if (typeof value !== 'string' || !value) throw new Error('GitHub identity missing');
          console.log(`::add-mask::${value}`);
          // Public trust metadata only; never print the token, signature, jti or user data.
          const [encodedHeader, encodedClaims] = value.split('.');
          const header = JSON.parse(Buffer.from(encodedHeader, 'base64url').toString());
          const claims = JSON.parse(Buffer.from(encodedClaims, 'base64url').toString());
          console.log(JSON.stringify({
            algorithm: header.alg, type: header.typ ?? null,
            repositoryId: claims.repository_id, ownerId: claims.repository_owner_id,
            repository: claims.repository, ref: claims.ref, workflow: claims.workflow_ref,
            subject: claims.sub, audience: claims.aud, issuer: claims.iss,
            event: claims.event_name, runner: claims.runner_environment,
            reusable: Boolean(claims.job_workflow_ref), lifetime: claims.exp - claims.iat,
            age: Math.floor(Date.now()/1000) - claims.iat,
          }));
          const response = await fetch(endpoint, {
            method: 'POST', headers: {Authorization: `Bearer ${value}`},
            redirect: 'error', signal: AbortSignal.timeout(180000),
          });
          if (!response.ok) throw new Error(`Notification job HTTP ${response.status}`);
          const result = await response.json();
          if (result.status !== 'completed') throw new Error('Notification job did not complete');
          console.log('Notification queue processing completed. Device delivery is checked separately.');
          NODE
